openapi: 3.0.3
info:
  title: Users API
  description: User and role management (admin only)
  version: 1.0.0

servers:
  - url: https://api.workorder.example.com/v1

tags:
  - name: Users
  - name: Roles

paths:
  /users:
    get:
      summary: List users
      operationId: listUsers
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: role_id
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      summary: Create user
      description: Administrator creates new user account
      operationId: createUser
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wechat_openid
                - name
                - role_id
              properties:
                wechat_openid:
                  type: string
                name:
                  type: string
                role_id:
                  type: integer
                contact_phone:
                  type: string
                department:
                  type: string
                supervisor_id:
                  type: integer
                  description: Required for Maintenance Workers
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get user details
      operationId: getUserById
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

    patch:
      summary: Update user
      operationId: updateUser
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role_id:
                  type: integer
                contact_phone:
                  type: string
                department:
                  type: string
                supervisor_id:
                  type: integer
                active:
                  type: boolean
      responses:
        '200':
          description: User updated

  /roles:
    get:
      summary: List roles
      operationId: listRoles
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        wechat_openid:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        contact_phone:
          type: string
        department:
          type: string
        supervisor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
        permissions:
          type: object
          properties:
            modules:
              type: object
              properties:
                submit_work_orders:
                  type: boolean
                review_work_orders:
                  type: boolean
                view_analytics:
                  type: boolean
                manage_users:
                  type: boolean
                configure_system:
                  type: boolean
