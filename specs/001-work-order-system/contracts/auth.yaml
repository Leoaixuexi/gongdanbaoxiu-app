openapi: 3.0.3
info:
  title: Authentication API
  description: WeChat login and JWT token management
  version: 1.0.0

servers:
  - url: https://api.workorder.example.com/v1

tags:
  - name: Authentication

paths:
  /auth/login:
    post:
      summary: WeChat login
      description: Exchange WeChat code for JWT token
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: WeChat login code from wx.login()
                  example: "081AbcDef2"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT access token
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          role:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              permissions:
                                type: object
                      expires_at:
                        type: string
                        format: date-time
        '401':
          description: Invalid WeChat code or user not found

  /auth/logout:
    post:
      summary: Logout
      description: Invalidate JWT token
      operationId: logout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful

  /auth/refresh:
    post:
      summary: Refresh token
      description: Get new JWT token before expiration
      operationId: refreshToken
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
