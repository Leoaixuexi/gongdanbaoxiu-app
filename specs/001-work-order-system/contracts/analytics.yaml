openapi: 3.0.3
info:
  title: Analytics API
  description: Dashboard KPIs and reporting endpoints
  version: 1.0.0

servers:
  - url: https://api.workorder.example.com/v1

tags:
  - name: Analytics

paths:
  /analytics/overview:
    get:
      summary: Get dashboard overview KPIs
      description: Real-time metrics for administrative dashboard
      operationId: getOverviewKPIs
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_active_orders:
                        type: integer
                        description: Work orders not yet completed
                      average_response_time_hours:
                        type: number
                        description: Avg time from creation to first action
                      average_resolution_time_hours:
                        type: number
                        description: Avg time from creation to completion
                      first_time_fix_rate:
                        type: number
                        description: Percentage of orders completed without rework (0-100)
                      overdue_rate:
                        type: number
                        description: Percentage of orders exceeding SLA (0-100)
                      total_completed:
                        type: integer
                      total_overdue:
                        type: integer

  /analytics/trends:
    get:
      summary: Get trend data over time
      description: Time series data for charts (daily/weekly/monthly volume)
      operationId: getTrends
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: granularity
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        created_count:
                          type: integer
                        completed_count:
                          type: integer
                        avg_resolution_hours:
                          type: number

  /analytics/by-category:
    get:
      summary: Work orders by fault type
      description: Distribution of work orders across categories
      operationId: getByCategory
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        fault_type:
                          type: string
                        count:
                          type: integer
                        percentage:
                          type: number

  /analytics/by-priority:
    get:
      summary: Work orders by priority
      description: Distribution across priority levels
      operationId: getByPriority
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        priority:
                          type: string
                          enum: [Low, Normal, High, Emergency]
                        count:
                          type: integer
                        percentage:
                          type: number

  /analytics/technician-performance:
    get:
      summary: Technician performance metrics
      description: Individual technician statistics
      operationId: getTechnicianPerformance
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        technician:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        total_assigned:
                          type: integer
                        total_completed:
                          type: integer
                        avg_resolution_hours:
                          type: number
                        first_time_fix_rate:
                          type: number
                        current_active:
                          type: integer

  /analytics/export:
    post:
      summary: Export analytics report
      description: Generate downloadable report in Excel/PDF/CSV
      operationId: exportReport
      tags:
        - Analytics
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - format
                - report_type
              properties:
                format:
                  type: string
                  enum: [excel, pdf, csv]
                report_type:
                  type: string
                  enum: [overview, trends, technician_performance]
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      download_url:
                        type: string
                        format: uri
                        description: Pre-signed URL for report download
                      expires_at:
                        type: string
                        format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
