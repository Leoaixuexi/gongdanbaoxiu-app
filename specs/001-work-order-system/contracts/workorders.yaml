openapi: 3.0.3
info:
  title: Work Orders API
  description: REST API for work order management (creation, status updates, queries)
  version: 1.0.0

servers:
  - url: https://api.workorder.example.com/v1
    description: Production server

tags:
  - name: Work Orders

paths:
  /workorders:
    get:
      summary: List work orders
      description: Retrieve work orders with filtering and pagination
      operationId: listWorkOrders
      tags:
        - Work Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Pending Repair, In Progress, Repaired, Needs Rework, Completed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [Low, Normal, High, Emergency]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrderSummary'

    post:
      summary: Create work order
      description: Property staff submits new work order
      operationId: createWorkOrder
      tags:
        - Work Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - floor
                - location
                - fault_type_id
                - priority
                - description
              properties:
                floor:
                  type: string
                location:
                  type: string
                fault_type_id:
                  type: integer
                priority:
                  type: string
                  enum: [Low, Normal, High, Emergency]
                description:
                  type: string
                photos:
                  type: array
                  items:
                    type: string
                  maxItems: 9
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkOrderDetail'

  /workorders/{id}/start:
    patch:
      summary: Start work order
      operationId: startWorkOrder
      tags:
        - Work Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Work order started

  /workorders/{id}/repair:
    patch:
      summary: Complete repair
      operationId: completeRepair
      tags:
        - Work Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Repaired, Needs Rework]
                completion_notes:
                  type: string
                photos:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Repair completed

  /workorders/{id}/review:
    patch:
      summary: Review work order
      operationId: reviewWorkOrder
      tags:
        - Work Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Completed, Needs Rework]
                review_notes:
                  type: string
      responses:
        '200':
          description: Review completed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WorkOrderSummary:
      type: object
      properties:
        id:
          type: integer
        order_number:
          type: string
        floor:
          type: string
        location:
          type: string
        fault_type:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        priority:
          type: string
        status:
          type: string
        submitter:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        assigned_technician:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        created_at:
          type: string
          format: date-time
        sla_deadline:
          type: string
          format: date-time
        is_overdue:
          type: boolean

    WorkOrderDetail:
      allOf:
        - $ref: '#/components/schemas/WorkOrderSummary'
        - type: object
          properties:
            description:
              type: string
            photos:
              type: array
              items:
                type: string
            completion_notes:
              type: string
            review_notes:
              type: string
            status_history:
              type: array
              items:
                type: object
                properties:
                  previous_status:
                    type: string
                  new_status:
                    type: string
                  actor:
                    type: object
                  created_at:
                    type: string
                    format: date-time
